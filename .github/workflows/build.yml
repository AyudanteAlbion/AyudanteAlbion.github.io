name: Build release assets

# Compila los artefactos, pero no publica una release ni escribe en el repositorio.
# La publicación ocurre en release.yml después de que este workflow termina bien.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versión a compilar (ej. v1.2.8)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validar versión y ref
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Versión inválida'; exit 1; }
          if [[ "$EVENT" == 'workflow_dispatch' && "$REF" != 'refs/heads/main' ]]; then
            echo 'Las compilaciones manuales deben ejecutarse desde main'; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar repositorio
        run: python3 scripts/validate_repo.py

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23'

      - name: Build (exe + zip)
        run: |
          GO_BIN="$(command -v go)" ./build.sh
          # Artefacto plano: upload-artifact guarda cada archivo relativo al
          # ancestro común de todas las rutas listadas. Con el exe en
          # albion-exe/ y el resto en la raíz, el ancestro es la raíz y el zip
          # del artefacto queda con albion-exe/AyudanteAlbion.exe adentro;
          # release.yml lo busca plano en release-assets/AyudanteAlbion.exe y
          # «Verificar artefactos» falla. Copiar el exe a la raíz deja los
          # cuatro archivos planos y además hace que SHA256SUMS.txt sirva tal
          # cual para quien descarga los archivos de la release.
          cp albion-exe/AyudanteAlbion.exe AyudanteAlbion.exe
          sha256sum AyudanteAlbion.exe AyudanteAlbion.zip > SHA256SUMS.txt
          printf '%s\n' "$TAG" > RELEASE_TAG.txt
          ls -lh AyudanteAlbion.exe AyudanteAlbion.zip SHA256SUMS.txt RELEASE_TAG.txt

      - name: Guardar artefactos de release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            AyudanteAlbion.exe
            AyudanteAlbion.zip
            SHA256SUMS.txt
            RELEASE_TAG.txt
          if-no-files-found: error
          retention-days: 14
