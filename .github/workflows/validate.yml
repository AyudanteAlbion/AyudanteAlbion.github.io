name: Validate

on:
  push:
    branches: [main]
    paths:
      - 'albion-app/**'
      - 'tools/**'
      - 'wrangler.toml'
      - '.github/**'
      - 'worker/**'
      - 'scripts/**'
      - 'package.json'
      - 'albion-exe/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'albion-app/**'
      - 'tools/**'
      - 'wrangler.toml'
      - '.github/**'
      - 'worker/**'
      - 'scripts/**'
      - 'package.json'
      - 'albion-exe/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar sintaxis, referencias y QA de fases
        run: npm test
