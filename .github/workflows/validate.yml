name: Validate

# Control de calidad transversal: sintaxis de JS/Python, referencias locales,
# tabla de códigos Photon y QA de fases. Cubre los TRES productos del repo
# (web, escritorio y worker) porque valida el repositorio como tal, no un
# artefacto: no compila nada ni publica nada.
#
# El build de cada producto vive en su propio workflow e independiente:
#   web.yml      → despliegue de la app web (GitHub Pages)
#   desktop.yml  → compilación de AyudanteAlbionDesktop.exe

on:
  push:
    branches: [main]
    paths:
      - 'albion-app/**'
      - 'desktop/**'
      - 'tools/**'
      - 'worker/**'
      - 'scripts/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/**'
  pull_request:
    paths:
      - 'albion-app/**'
      - 'desktop/**'
      - 'tools/**'
      - 'worker/**'
      - 'scripts/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar sintaxis, referencias y QA de fases
        run: npm test
