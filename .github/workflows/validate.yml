name: Validate

on:
  push:
    branches: [main]
    paths:
      - 'albion-app/**'
      - 'tools/**'
      - 'wrangler.toml'
      - '.github/**'
      - 'worker/**'
      - 'scripts/**'
      - 'albion-exe/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'albion-app/**'
      - 'tools/**'
      - 'wrangler.toml'
      - '.github/**'
      - 'worker/**'
      - 'scripts/**'
      - 'albion-exe/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validar sintaxis y referencias
        run: python3 scripts/validate_repo.py
