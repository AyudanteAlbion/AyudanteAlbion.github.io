name: 🏗️ Build y publicar release

# Con un tag v*, un release publicado o una ejecución manual: verifica las regresiones,
# compila el .exe de Windows y genera el .zip, y publica todo como Release.
# Corre en GitHub Actions porque necesita red libre para bajar Go y Node deps.

'on':
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versión a publicar (ej. v1.2.8)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar versión y commit
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Versión inválida'; exit 1; }
          if [[ "$EVENT" == 'workflow_dispatch' && "$REF" != 'refs/heads/main' ]]; then
            echo 'Los releases manuales deben ejecutarse desde main'; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            [[ "$(git rev-parse "$TAG^{commit}")" == "$GITHUB_SHA" ]] || { echo 'El tag ya apunta a otro commit'; exit 1; }
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Instalar jsdom (versión probada para QA)
        run: npm install --no-save --package-lock=false jsdom@30.0.1
        working-directory: albion-app

      - name: Selftest del worker (acceso SG + proxies)
        run: node worker/selftest.mjs

      - name: QA completa (todos los módulos + acceso SG)
        run: node qa-test.js
        working-directory: albion-app

      - name: Regresiones de Black Market e Islas
        run: |
          node black-market-test.js
          node farm-test.js
        working-directory: albion-app

      - name: Build (sintaxis + smoke + exe + zip)
        run: |
          GO_BIN="$(command -v go)" ./build.sh
          ls -lh AyudanteAlbion.zip albion-exe/AyudanteAlbion.exe

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### ⬇️ Instalación'
            echo 'Descargá **`AyudanteAlbion.exe`** y hacé doble clic: la app se abre sola en tu navegador'
            echo 'y se apaga al cerrar la pestaña. **`AyudanteAlbion.zip`** trae el ejecutable + código fuente completo.'
            echo 'Requisito: Windows 10/11 x64. No necesita instalación ni permisos de admin.'
          } > RELEASE_NOTES.md
          if [[ -f "docs/releases/$TAG.md" ]]; then
            printf '\n' >> RELEASE_NOTES.md
            cat "docs/releases/$TAG.md" >> RELEASE_NOTES.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe; reemplazando assets…"
            gh release upload "$TAG" albion-exe/AyudanteAlbion.exe AyudanteAlbion.zip --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              albion-exe/AyudanteAlbion.exe#AyudanteAlbion.exe \
              AyudanteAlbion.zip#AyudanteAlbion.zip \
              --target "$GITHUB_SHA" \
              --title "Ayudante Albion $TAG" \
              --notes-file RELEASE_NOTES.md \
              --generate-notes \
              --latest
          fi
          gh release view "$TAG"
