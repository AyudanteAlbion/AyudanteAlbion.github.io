name: 🏗️ Build y publicar release

# Al pushear un tag v* (ej. v1.2.0): verifica sintaxis, corre la prueba de humo,
# compila el .exe de Windows y genera el .zip, y publica todo como Release.
# Corre en GitHub Actions porque necesita red libre para bajar Go y Node deps.

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Instalar jsdom (para la prueba de humo)
        run: npm install --no-save jsdom
        working-directory: albion-app

      - name: Selftest del worker (acceso SG + proxies)
        run: node worker/selftest.mjs

      - name: QA completa (todos los módulos + acceso SG)
        run: node qa-test.js
        working-directory: albion-app

      - name: Build (sintaxis + smoke + exe + zip)
        run: |
          GO_BIN="$(command -v go)" ./build.sh
          ls -lh AyudanteAlbion.zip albion-exe/AyudanteAlbion.exe

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo '### ⬇️ Instalación'
            echo 'Descargá **`AyudanteAlbion.exe`** y hacé doble clic: la app se abre sola en tu navegador'
            echo 'y se apaga al cerrar la pestaña. **`AyudanteAlbion.zip`** trae el ejecutable + código fuente completo.'
            echo 'Requisito: Windows 10/11 x64. No necesita instalación ni permisos de admin.'
          } > RELEASE_NOTES.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe; reemplazando assets…"
            gh release upload "$TAG" albion-exe/AyudanteAlbion.exe AyudanteAlbion.zip --clobber
          else
            gh release create "$TAG" \
              albion-exe/AyudanteAlbion.exe#AyudanteAlbion.exe \
              AyudanteAlbion.zip#AyudanteAlbion.zip \
              --title "Ayudante Albion $TAG" \
              --notes-file RELEASE_NOTES.md \
              --generate-notes \
              --latest
          fi
          gh release view "$TAG"
