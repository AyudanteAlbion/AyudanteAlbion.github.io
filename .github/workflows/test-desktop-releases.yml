name: Test desktop releases

# Genera paquetes temporales para probar las dos ediciones de Windows.
# No crea tags ni GitHub Releases: los resultados quedan únicamente como
# artefactos de la ejecución y GitHub los elimina después de siete días.

on:
  pull_request:
    paths:
      - 'albion-app/**'
      - 'albion-exe/**'
      - 'build.sh'
      - 'scripts/validate_repo.py'
      - '.github/workflows/test-desktop-releases.yml'
  push:
    branches: [main]
    paths:
      - 'albion-app/**'
      - 'albion-exe/**'
      - 'build.sh'
      - 'scripts/validate_repo.py'
      - '.github/workflows/test-desktop-releases.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-desktop-releases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build desktop .exe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.4'
          cache: false

      # Es importante ejecutar el build de distribución completo. Un `go
      # build` genérico (incluido el autobuild de CodeQL/Analyze (go)) no
      # prueba la compilación cruzada de Windows ni el build tag `tracker`.
      - name: Compilar las dos ediciones con build.sh
        run: GO_BIN="$(command -v go)" ./build.sh

      # build.sh sincroniza albion-app/ en albion-exe/app/, requerido por
      # go:embed antes de que el paquete pueda compilarse para sus tests.
      - name: Ejecutar tests del tracker
        working-directory: albion-exe
        run: go test ./...

      - name: Verificar y separar paquetes de prueba
        run: |
          set -euo pipefail
          test -s albion-exe/AyudanteAlbion.exe
          test -s albion-exe/AyudanteAlbion-Tracker.exe
          file albion-exe/AyudanteAlbion.exe | grep -q 'PE32+'
          file albion-exe/AyudanteAlbion-Tracker.exe | grep -q 'PE32+'
          if cmp -s albion-exe/AyudanteAlbion.exe albion-exe/AyudanteAlbion-Tracker.exe; then
            echo 'Las ediciones estándar y Tracker no pueden ser idénticas'
            exit 1
          fi

          mkdir -p test-release-standard test-release-tracker
          cp albion-exe/AyudanteAlbion.exe test-release-standard/
          cp albion-exe/AyudanteAlbion-Tracker.exe test-release-tracker/
          cp albion-app/data/photon_codes.json test-release-tracker/

          (
            cd test-release-standard
            sha256sum AyudanteAlbion.exe > SHA256SUMS.txt
          )
          (
            cd test-release-tracker
            sha256sum AyudanteAlbion-Tracker.exe photon_codes.json > SHA256SUMS.txt
          )

          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            | tee test-release-standard/BUILD_INFO.txt \
                  test-release-tracker/BUILD_INFO.txt >/dev/null
          (cd test-release-standard && sha256sum -c SHA256SUMS.txt)
          (cd test-release-tracker && sha256sum -c SHA256SUMS.txt)

      - name: Guardar edición estándar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AyudanteAlbion-Desktop-${{ github.sha }}
          path: test-release-standard/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Guardar edición Tracker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AyudanteAlbion-Tracker-${{ github.sha }}
          path: test-release-tracker/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
