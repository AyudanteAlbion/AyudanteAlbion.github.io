# Sonda temporal: verifica el worker desde un runner con red.
name: Chequeo Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/worker-check.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Probar
        run: |
          W="https://ayudantealbion.josemesina21.workers.dev"
          hit() {
            code=$(curl -s -m 25 -o /tmp/o -w '%{http_code}' "$W$1" || echo 000)
            printf '::error::%s => HTTP %s BODY=%s\n' "$1" "$code" "$(head -c 200 /tmp/o | tr '\n\r' '  ' | sed 's/%/%25/g')"
          }
          hit "/gameinfo/players/-8WMptPeTSy5PbVJiPPGoQ"
          hit "/gameinfo/players/-8WMptPeTSy5PbVJiPPGoQ/kills"
          echo listo
