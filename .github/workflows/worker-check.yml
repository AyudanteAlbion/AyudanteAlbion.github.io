# Sonda temporal: verifica worker (jugador real) y la app publicada en Pages.
name: Chequeo Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/worker-check.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Probar
        run: |
          W="https://ayudantealbion.josemesina21.workers.dev"
          code=$(curl -s -m 25 -o /tmp/p -w '%{http_code}' "$W/gameinfo/players/longsword1" || echo 000)
          printf '::error::players/longsword1 => HTTP %s BODY=%s\n' "$code" "$(head -c 200 /tmp/p | tr '\n\r' '  ' | sed 's/%/%25/g')"
          code=$(curl -s -m 25 -o /tmp/s -w '%{http_code}' "$W/gameinfo/seasons/current" || echo 000)
          printf '::error::seasons/current => HTTP %s BODY=%s\n' "$code" "$(head -c 160 /tmp/s | tr '\n\r' '  ' | sed 's/%/%25/g')"
          n=$(curl -s -m 25 "https://guallama31.github.io/AyudanteAlbion/app.js" | grep -c "AA_WORKER" || true)
          printf '::error::pages app.js con AA_WORKER: %s\n' "$n"
          c=$(curl -s -m 25 -o /tmp/c -w '%{http_code}' "https://guallama31.github.io/AyudanteAlbion/data/catalog.json")
          printf '::error::pages catalog.json => HTTP %s SIZE=%s\n' "$c" "$(wc -c < /tmp/c)"
          echo listo
