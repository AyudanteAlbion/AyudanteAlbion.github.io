# Publica albion-app/ como sitio estático en GitHub Pages.
# Solo copia lo que la web necesita: los módulos de js/, la carpeta de datos,
# los íconos y los tres archivos de la app. Las herramientas de desarrollo
# quedan afuera a propósito.
# Las actions van pineadas por SHA de commit (con su versión en un comentario):
# si un tag se moviera en upstream, acá seguimos ejecutando el código auditado.
name: Pages
on:
  push:
    branches: [main]
    paths:
      - 'albion-app/index.html'
      - 'albion-app/app.js'
      - 'albion-app/styles.css'
      - 'albion-app/js/**'
      - 'albion-app/data/**'
      - 'albion-app/icons/**'
      - 'albion-app/img/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar sitio
        run: |
          mkdir _site
          cp albion-app/index.html albion-app/app.js albion-app/styles.css _site/
          cp -r albion-app/data albion-app/icons albion-app/img _site/
          # Los módulos que index.html carga con <script src="js/...">.
          cp -r albion-app/js _site/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
