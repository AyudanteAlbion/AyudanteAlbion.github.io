name: Escritorio

# ============================================================
# AyudanteAlbionDesktop.exe — app de escritorio nativa (Wails v2 + WebView2).
#
# Edición ÚNICA. Antes había dos binarios (estándar y Tracker) construidos con
# build tags desde albion-exe/; ahora hay uno solo, con el tracker siempre
# compilado y apagado por defecto, que se enciende desde la interfaz.
#
# Este workflow NO toca la web. Se dispara solo con cambios del escritorio:
#   desktop/**  → código Go + frontend propio (desktop/ui/)
# Los cambios en albion-app/ (la web) ya NO lo disparan: el frontend del
# escritorio está forkeado en desktop/ui/ y evoluciona por su cuenta.
#
# Excepción deliberada: albion-app/{data,icons,img} son assets compartidos
# (íconos de ítems y tablas de Albion) que el .exe embebe en tiempo de build.
# Se vigilan porque un cambio ahí sí llega al binario.
#
# No publica releases: deja el .exe como artefacto de la ejecución.
# Wails necesita compilarse EN Windows (WebView2 + toolchain nativa).
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'albion-app/data/**'
      - 'albion-app/icons/**'
      - 'albion-app/img/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'albion-app/data/**'
      - 'albion-app/icons/**'
      - 'albion-app/img/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build AyudanteAlbionDesktop.exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.4'
          cache: false

      # Se valida el frontend PROPIO del escritorio, no el de la web.
      - name: Verificar sintaxis del frontend de escritorio
        shell: bash
        run: node --check desktop/ui/app.js

      # La tabla de códigos Photon se edita a mano y se carga sin recompilar:
      # validarla acá evita publicar un .exe con el tracker roto.
      - name: Validar tabla de códigos Photon
        shell: bash
        run: python3 scripts/validate_photon_codes.py

      - name: Preparar frontend embebido (ui/ + assets)
        shell: bash
        run: ./desktop/sync_frontend.sh

      - name: Instalar Wails CLI
        shell: bash
        working-directory: desktop
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolver dependencias Go
        shell: bash
        working-directory: desktop
        run: go mod tidy

      - name: Ejecutar tests del tracker
        shell: bash
        working-directory: desktop
        run: go test ./...

      - name: Diagnóstico de Wails (wails doctor)
        shell: bash
        working-directory: desktop
        run: wails doctor || true

      - name: Compilar la app (wails build)
        shell: bash
        working-directory: desktop
        # -webview2 download: si al usuario le falta el runtime WebView2, el
        # instalador lo descarga solo. -s: build de producción (sin dev tooling).
        run: wails build -platform windows/amd64 -webview2 download -s

      - name: Verificar el binario
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          test -s build/bin/AyudanteAlbionDesktop.exe
          ls -lh build/bin/

      - name: Preparar paquete
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          # La tabla de códigos viaja embebida, pero también suelta junto al
          # .exe: así se arregla el tracker tras un patch de Albion sin
          # recompilar (el binario prefiere la copia externa).
          cp ../albion-app/data/photon_codes.json build/bin/
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > build/bin/BUILD_INFO.txt
          (cd build/bin && sha256sum AyudanteAlbionDesktop.exe photon_codes.json > SHA256SUMS.txt)
          (cd build/bin && sha256sum -c SHA256SUMS.txt)

      - name: Guardar artefacto
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AyudanteAlbionDesktop-${{ github.sha }}
          path: desktop/build/bin/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
